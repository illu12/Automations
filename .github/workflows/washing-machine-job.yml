name: Evening washing machine availability

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch: # Allows for manual triggering
  
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run washing-machine-job
        env:
          E_VASKERI_EMAIL: ${{ secrets.E_VASKERI_EMAIL }}
          E_VASKERI_PASSWORD: ${{ secrets.E_VASKERI_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
